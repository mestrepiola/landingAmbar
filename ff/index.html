<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando...</title>
  <meta http-equiv="refresh" content="0; url=https://ambarquadros.lojavirtualnuvem.com.br/" />
  <script>
    window.location.href = "https://ambarquadros.lojavirtualnuvem.com.br/";
  </script>
  <style>
    body {
      font-family: 'Cormorant Garamond', serif;
      background: #f4efe7;
      color: #5d4638;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid #ddd3c6;
      border-top-color: #b67b10;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 1.25rem;
      color: #7b6a5c;
    }
    a {
      color: #b67b10;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Redirecionando para a loja...</p>
    <p>
      <a href="https://ambarquadros.lojavirtualnuvem.com.br/">Clique aqui</a>
      se não for redirecionado automaticamente.
    </p>
  </div>
</body>
</html>
